name: build-apk

# push main → 自动：构建号+1 → 构建分 ABI APK → 建/更新 Release → 回写 assets/app_version.json
# 应用侧「检查更新」读 app_version.json 比对构建号（versionCode）。
# 版本名 = 康途独立版本线（发布前手动定名，不再跟随上游），构建号严格递增。

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ⓪ 门禁：静态分析 + 全量测试。放在 prepare **之前** → 红了连构建号都不加，
  #    零副作用（不出包、不建 Release、不回写 app_version.json）。
  #    为什么要拦在这里：我们平时直接 push main，GitHub 不支持「另一个 workflow 来挡」，
  #    单开 check.yml 只能自己红、发布照发，等于没门禁（ISS-219）。
  #    分析强度（2026-11-04 已收紧）：**warning 也挡**（只放行 info）。首轮曾只让 error 挡，
  #    确认无 CI/本地版本差异噪音后收紧；若将来 CI 因版本差异冒出 warning，先修代码再考虑放宽。
  check:
    runs-on: ubuntu-latest
    # 防 runner 卡死：GitHub 默认上限 360 分钟，卡住会白等一整天（本地实测过 flutter test 卡死）
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --no-pub

  # ① 构建号 +1（versionName = 康途独立版本线，发布前在 pubspec 手动定名；
  #    versionCode 严格递增，否则 Android 不允许覆盖安装、更新器也认不出新版本）
  prepare:
    needs: check
    if: github.event_name == 'push' && needs.check.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      build: ${{ steps.bump.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump build number
        id: bump
        run: |
          set -e
          V=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)
          NAME=${V%%+*}
          BUILD=${V##*+}
          NEW=$((BUILD+1))
          sed -i "s|^version:.*|version: ${NAME}+${NEW}|" pubspec.yaml
          echo "version=${NAME}" >> "$GITHUB_OUTPUT"
          echo "build=${NEW}" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore(version): ${NAME}+${NEW} [skip ci]"
          git push origin HEAD:main

  # ② 构建分 ABI release APK（显式传入新版本号，与 prepare 的输出一致）
  build:
    needs: [check, prepare]
    if: always() && (needs.prepare.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build split APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          ARGS=""
          if [ -n "${{ needs.prepare.outputs.build }}" ]; then
            NAME="${{ needs.prepare.outputs.version }}"
            BUILD="${{ needs.prepare.outputs.build }}"
          else
            # 兜底（手动 dispatch 无 prepare 输出）：与 prepare 步同一套解析，
            # 用 [[:space:]]* 吃掉“version: ”后的空格，避免 name 带前导空格（ISS-156）
            RAW=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)
            NAME=${RAW%%+*}
            BUILD=${RAW##*+}
          fi
          # fail-loud：版本名不得为空或含空白（B7，防再出 ISS-156 类静默滑过）
          case "$NAME" in
            ""|*[[:space:]]*) echo "::error::bad version name '$NAME'"; exit 1 ;;
          esac
          ARGS="--build-name=${NAME} --build-number=${BUILD}"
          flutter build apk --release --split-per-abi $ARGS
          ls -l build/app/outputs/flutter-apk/

      - name: Rename APKs
        run: |
          set -e
          D=build/app/outputs/flutter-apk
          mv $D/app-arm64-v8a-release.apk   "$D/kangtu-arm64-v8a.apk"
          mv $D/app-armeabi-v7a-release.apk "$D/kangtu-armeabi-v7a.apk"
          mv $D/app-x86_64-release.apk      "$D/kangtu-x86_64.apk"
          ls -l $D

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kangtu-apks
          path: build/app/outputs/flutter-apk/kangtu-*.apk
          if-no-files-found: error
          retention-days: 30

  # ③ 建/更新 Release + 回写 app_version.json（应用端的版本清单）
  publish:
    needs: [prepare, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # 生成发行说明需要完整历史与 tags

      - uses: actions/download-artifact@v4
        with:
          name: kangtu-apks
          path: apks

      - name: Resolve version
        id: v
        run: |
          set -e
          if [ -n "${{ needs.prepare.outputs.version }}" ]; then
            V="${{ needs.prepare.outputs.version }}"
            B="${{ needs.prepare.outputs.build }}"
          else
            # 兜底：同 build 步，吃掉“version: ”后的空格（ISS-156）
            RAW=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)
            V=${RAW%%+*}
            B=${RAW##*+}
          fi
          # fail-loud：空/含空白版本名直接失败（避免生成非法 tag，如 “v 1.1.0.31”）
          case "$V" in
            ""|*[[:space:]]*) echo "::error::bad version name '$V'"; exit 1 ;;
          esac
          echo "name=${V}" >> "$GITHUB_OUTPUT"
          echo "build=${B}" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}.${B}" >> "$GITHUB_OUTPUT"

      # 发行说明：取「上个 tag 之后」的提交（滤掉机器人 chore 提交），无则兜底一行
      - name: Build release notes
        run: |
          set -e
          PREV=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            if [ -n "$PREV" ]; then git log --no-merges --pretty=format:'- %s' "${PREV}..HEAD"; fi
          } > raw.md || true
          grep -vE 'chore\((version|update)\)|\[skip ci\]' raw.md > notes.md || true
          if [ ! -s notes.md ]; then echo "- 维护更新（${{ steps.v.outputs.tag }}）" > notes.md; fi
          # 人工正文优先：docs/RELEASE_NOTES.md 存在则**替代**上面自动生成的提交列表
          # （用户视角的正文由人写更可读；原始提交列表在 GitHub 的 compare 视图里仍可查）。
          # 每次发版前更新该文件；不需要人工正文时删掉它，即回退到自动提交列表（ISS-220）。
          if [ -f docs/RELEASE_NOTES.md ] && [ -s docs/RELEASE_NOTES.md ]; then
            cp docs/RELEASE_NOTES.md notes.md
          fi
          # 置顶块：docs/RELEASE_HEAD.md 存在就放在发行说明最前面。
          # 用途：把「必须先导出备份」这类**用户在更新弹窗里就得看见**的话顶上去 ——
          # 因为下面 Write back 那步的 desc 直接取 notes.md，弹窗展示的就是它。
          # 一次性提示用完请把该文件删掉（ISS-215 / RISK-102）。
          if [ -f docs/RELEASE_HEAD.md ]; then
            cat docs/RELEASE_HEAD.md > head.md
            printf '\n\n' >> head.md
            cat notes.md >> head.md
            mv head.md notes.md
          fi
          echo '--- notes ---'; cat notes.md

      # 一律发「预发行版」（Howe 2026-10-25 定），并把发行说明写进去
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.v.outputs.tag }}"
          TITLE="康途 ${{ steps.v.outputs.name }} (${{ steps.v.outputs.build }})"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apks/*.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md --prerelease
          else
            gh release create "$TAG" apks/*.apk --title "$TITLE" --notes-file notes.md --prerelease
          fi

      - name: Write back assets/app_version.json
        run: |
          set -e
          TAG="${{ steps.v.outputs.tag }}"
          BASE="https://github.com/Howezzzzz/kangtu-rehab/releases/download/${TAG}"
          MIRROR="https://gh-proxy.com/${BASE}"
          MIRROR2="https://ghproxy.net/${BASE}"
          MIRROR3="https://ghproxy.cc/${BASE}"
          # 更新内容写进清单 desc（App 更新弹窗会展示）；page_url 指向该 tag
          # （不再用 /releases/latest —— 那个会跳过预发行版）
          DESC=$(python3 -c "import json;print(json.dumps(open('notes.md',encoding='utf-8').read().strip(), ensure_ascii=False))")
          cat > assets/app_version.json <<EOF
          {
            "version": "${{ steps.v.outputs.name }}",
            "version_code": ${{ steps.v.outputs.build }},
            "desc": ${DESC},
            "page_url": "https://github.com/Howezzzzz/kangtu-rehab/releases/tag/${TAG}",
            "download_urls": {
              "arm64-v8a": "${BASE}/kangtu-arm64-v8a.apk",
              "armeabi-v7a": "${BASE}/kangtu-armeabi-v7a.apk",
              "x86_64": "${BASE}/kangtu-x86_64.apk"
            },
            "mirror_urls": {
              "arm64-v8a": "${MIRROR}/kangtu-arm64-v8a.apk",
              "armeabi-v7a": "${MIRROR}/kangtu-armeabi-v7a.apk",
              "x86_64": "${MIRROR}/kangtu-x86_64.apk"
            },
            "mirrors": {
              "arm64-v8a": ["${MIRROR}/kangtu-arm64-v8a.apk", "${MIRROR2}/kangtu-arm64-v8a.apk", "${MIRROR3}/kangtu-arm64-v8a.apk"],
              "armeabi-v7a": ["${MIRROR}/kangtu-armeabi-v7a.apk", "${MIRROR2}/kangtu-armeabi-v7a.apk", "${MIRROR3}/kangtu-armeabi-v7a.apk"],
              "x86_64": ["${MIRROR}/kangtu-x86_64.apk", "${MIRROR2}/kangtu-x86_64.apk", "${MIRROR3}/kangtu-x86_64.apk"]
            }
          }
          EOF
          cat assets/app_version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app_version.json
          git commit -m "chore(update): app_version.json -> ${{ steps.v.outputs.name }}.${{ steps.v.outputs.build }} [skip ci]" || echo "no changes"
          git push origin HEAD:main
