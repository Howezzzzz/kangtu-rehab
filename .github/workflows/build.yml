name: build-apk

# push main → check 门禁（analyze + 全量测试）→ 构建号 +1 → 分 ABI 构建 → 发 Release → 回写 app_version.json
#
# 为什么要有这条流水线（康途，2026-11 定）：
#   ① 应用内「检查更新」的数据源是仓库里的 assets/app_version.json —— **只有这条流水线会写它**，
#      没有它更新器永远看不到新版本；
#   ② 这是本环境**唯一**能拿到真实 Android 构建的地方（本地沙箱无 Android SDK）；
#   ③ check 门禁卡在「加构建号」之前：测试红了连版本号都不加（零副作用）。
#
# 上游自带的 build-apk.yml 已删除：它是第二条能发版的流水线，却不 bump 构建号、不回写清单
# （用它发的版，应用内更新器永远看不到），且 Flutter 版本与我们不同 —— 留一条权威流水线即可。
# 有守门锁「只有本文件可以发版」。

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # 与出包用同一个版本（门禁验的必须就是要发的那个构建）
  FLUTTER_VERSION: '3.47.6'

jobs:
  # ⓪ 门禁：静态分析 + 全量测试。红了 → prepare 不跑 → 不加构建号、不出包、不发版（零副作用）
  check:
    runs-on: ubuntu-latest
    # 防 runner 卡死：GitHub 默认 360 分钟，卡住会白等一整天（本地实测过 flutter test 卡死）
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        # 只放行 info；warning/error 一律挡
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  # ① 构建号 +1（versionName 手动定名；versionCode 严格递增，否则 Android 不允许覆盖安装）
  prepare:
    needs: check
    if: github.event_name == 'push' && needs.check.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      build: ${{ steps.bump.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump build number
        id: bump
        run: |
          set -e
          V=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)
          NAME=${V%%+*}
          BUILD=${V##*+}
          NEW=$((BUILD+1))
          sed -i "s|^version:.*|version: ${NAME}+${NEW}|" pubspec.yaml
          echo "version=${NAME}" >> "$GITHUB_OUTPUT"
          echo "build=${NEW}" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore(version): ${NAME}+${NEW} [skip ci]"
          git push origin HEAD:main

  # ② 构建分 ABI release APK
  build:
    needs: [check, prepare]
    # check 必须成功（dispatch 也不放过）；prepare 在 dispatch 下是 skipped，故单独放行
    if: needs.check.result == 'success' && (needs.prepare.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # 签名：把 secrets 里的 keystore 落盘 + 生成 key.properties。
      # ⚠ 没有这一步，Gradle 会**静默回落 debug 签名**（构建照样绿，产物却不能用）——
      # 而 debug keystore 是公开的 = 等于没有签名防护。守门测试锁住本步骤。
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64" || { echo "::error::missing secret KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/kangtu-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=kangtu-release.jks
          EOF

      - name: Build split APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          ARGS=""
          if [ -n "${{ needs.prepare.outputs.build }}" ]; then
            ARGS="--build-name=${{ needs.prepare.outputs.version }} --build-number=${{ needs.prepare.outputs.build }}"
          fi
          flutter build apk --release --split-per-abi $ARGS
          ls -l build/app/outputs/flutter-apk/

      - name: Rename APKs
        run: |
          set -e
          D=build/app/outputs/flutter-apk
          mv $D/app-arm64-v8a-release.apk   "$D/kangtu-arm64-v8a.apk"
          mv $D/app-armeabi-v7a-release.apk "$D/kangtu-armeabi-v7a.apk"
          mv $D/app-x86_64-release.apk      "$D/kangtu-x86_64.apk"
          ls -l $D
          # 资产名必须与 assets/app_version.json 的 download_urls 逐字一致（有守门测试锁）

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kangtu-apks
          path: build/app/outputs/flutter-apk/kangtu-*.apk
          if-no-files-found: error
          retention-days: 30

  # ③ 建/更新 Release + 回写 assets/app_version.json（含每个 ABI 的 sha256）
  publish:
    needs: [prepare, build]
    # build 成功即可发版（dispatch 下 prepare 恒 skipped，不能用 needs 全成功判定）
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: kangtu-apks
          path: apks

      - name: Resolve version
        id: v
        run: |
          set -e
          RAW=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)
          V=${RAW%%+*}
          B=${RAW##*+}
          case "$V" in
            ""|*[[:space:]]*) echo "::error::bad version name '$V'"; exit 1 ;;
          esac
          echo "name=${V}" >> "$GITHUB_OUTPUT"
          echo "build=${B}" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}.${B}" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: |
          set -e
          PREV=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            if [ -n "$PREV" ]; then git log --no-merges --pretty=format:'- %s' "${PREV}..HEAD"; fi
          } > raw.md || true
          grep -vE 'chore\((version|update)\)|\[skip ci\]' raw.md > notes.md || true
          if [ ! -s notes.md ]; then echo "- 维护更新（${{ steps.v.outputs.tag }}）" > notes.md; fi
          # 人工正文优先：docs/RELEASE_NOTES.md 存在则替代自动提交列表
          if [ -f docs/RELEASE_NOTES.md ] && [ -s docs/RELEASE_NOTES.md ]; then
            cp docs/RELEASE_NOTES.md notes.md
          fi
          # 置顶块：docs/RELEASE_HEAD.md 存在则放最前（迁移警示这类必须被用户看到的话）
          if [ -f docs/RELEASE_HEAD.md ]; then
            cat docs/RELEASE_HEAD.md > head.md
            printf '\n\n' >> head.md
            cat notes.md >> head.md
            mv head.md notes.md
          fi
          echo '--- notes ---'; cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.v.outputs.tag }}"
          TITLE="康途 ${{ steps.v.outputs.name }} (${{ steps.v.outputs.build }})"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apks/*.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md --prerelease
          else
            gh release create "$TAG" apks/*.apk --title "$TITLE" --notes-file notes.md --prerelease
          fi

      - name: Write back assets/app_version.json
        run: |
          set -e
          TAG="${{ steps.v.outputs.tag }}"
          BASE="https://github.com/Howezzzzz/kangtu-rehab/releases/download/${TAG}"
          MIRROR="https://gh-proxy.com/${BASE}"
          MIRROR2="https://ghproxy.net/${BASE}"
          MIRROR3="https://ghproxy.cc/${BASE}"
          # 每个 ABI 的 SHA-256：应用内更新会据此校验下载包（防镜像篡改/截断）——
          # **必须有**，否则更新模块的完整性校验形同虚设（有守门测试锁）
          S1=$(sha256sum apks/kangtu-arm64-v8a.apk   | cut -d' ' -f1)
          S2=$(sha256sum apks/kangtu-armeabi-v7a.apk | cut -d' ' -f1)
          S3=$(sha256sum apks/kangtu-x86_64.apk      | cut -d' ' -f1)
          DESC=$(python3 -c "import json;print(json.dumps(open('notes.md',encoding='utf-8').read().strip(), ensure_ascii=False))")
          cat > assets/app_version.json <<EOF
          {
            "version": "${{ steps.v.outputs.name }}",
            "version_code": ${{ steps.v.outputs.build }},
            "desc": ${DESC},
            "page_url": "https://github.com/Howezzzzz/kangtu-rehab/releases/tag/${TAG}",
            "download_urls": {
              "arm64-v8a": "${BASE}/kangtu-arm64-v8a.apk",
              "armeabi-v7a": "${BASE}/kangtu-armeabi-v7a.apk",
              "x86_64": "${BASE}/kangtu-x86_64.apk"
            },
            "sha256": {
              "arm64-v8a": "${S1}",
              "armeabi-v7a": "${S2}",
              "x86_64": "${S3}"
            },
            "mirror_urls": {
              "arm64-v8a": "${MIRROR}/kangtu-arm64-v8a.apk",
              "armeabi-v7a": "${MIRROR}/kangtu-armeabi-v7a.apk",
              "x86_64": "${MIRROR}/kangtu-x86_64.apk"
            },
            "mirrors": {
              "arm64-v8a": ["${MIRROR}/kangtu-arm64-v8a.apk", "${MIRROR2}/kangtu-arm64-v8a.apk", "${MIRROR3}/kangtu-arm64-v8a.apk"],
              "armeabi-v7a": ["${MIRROR}/kangtu-armeabi-v7a.apk", "${MIRROR2}/kangtu-armeabi-v7a.apk", "${MIRROR3}/kangtu-armeabi-v7a.apk"],
              "x86_64": ["${MIRROR}/kangtu-x86_64.apk", "${MIRROR2}/kangtu-x86_64.apk", "${MIRROR3}/kangtu-x86_64.apk"]
            }
          }
          EOF
          cat assets/app_version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app_version.json
          git commit -m "chore(update): app_version.json -> ${{ steps.v.outputs.name }}.${{ steps.v.outputs.build }} [skip ci]" || echo "no changes"
          git push origin HEAD:main
